# ===================================================================
# Test Configuration for EngHub Unit Tests
# H2 In-Memory Database Configuration
# Used by @DataJpaTest and @SpringBootTest with TestPropertySource
# ===================================================================

# ===== H2 DATABASE CONFIGURATION =====
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===== H2 CONFIGURATION =====
# Initialize H2 console (optional, for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== JPA/HIBERNATE CONFIGURATION =====
# DDL-AUTO: create-drop ensures clean DB for each test
# Each test class gets a fresh database, no data leakage between tests
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.jdbc.fetch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ===== LOGGING CONFIGURATION =====
# Set logging levels for test execution
logging.level.root=WARN
logging.level.ptit.com.enghub=DEBUG
logging.level.org.springframework=WARN
logging.level.org.springframework.test.context.cache=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ===== SECURITY CONFIGURATION =====
# Security context mocking for @WithMockUser annotation
spring.security.user.name=testuser
spring.security.user.password=testpass
spring.security.user.roles=ROLE_USER,ROLE_ADMIN

# ===== APPLICATION CONFIGURATION =====
# General application settings for tests
app.name=EngHub-Test
app.environment=TEST
spring.application.name=enghub-test

# ===== TRANSACTION CONFIGURATION =====
# Ensure transactional tests work correctly
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
spring.jpa.open-in-view=false

# ===== TEST-SPECIFIC SETTINGS =====
# Disable unnecessary features during testing
spring.devtools.restart.enabled=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
